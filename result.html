<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Result — Physics For Fun Pre-Test</title>
  <meta name="description" content="See your Physics Practical Skills Pre-Test results." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚗️</text></svg>" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css?v=2.0" />
  <style>
    .comparison-card {
      background: rgba(16,185,129,0.06);
      border: 1.5px solid rgba(16,185,129,0.2);
      border-radius: var(--radius);
      padding: 28px 24px;
      margin-top: 20px;
      animation: fadeUp 0.5s ease both;
      animation-delay: 0.2s;
    }
    .comparison-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .comparison-item {
      text-align: center;
      min-width: 100px;
    }
    .comparison-item .label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .comparison-item .score-big {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
    }
    .comparison-item .score-pct {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .comparison-arrow {
      font-size: 2rem;
      color: var(--text-muted);
    }
    .improvement-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 12px;
    }
    .improvement-badge.positive {
      background: rgba(34,197,94,0.15);
      color: var(--green);
      border: 1px solid rgba(34,197,94,0.3);
    }
    .improvement-badge.negative {
      background: rgba(244,63,94,0.15);
      color: var(--red);
      border: 1px solid rgba(244,63,94,0.3);
    }
    .improvement-badge.neutral {
      background: rgba(245,158,11,0.15);
      color: var(--amber);
      border: 1px solid rgba(245,158,11,0.3);
    }
    .no-pretest {
      text-align: center;
      padding: 16px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <span class="navbar-brand">⚗️ <span class="brand-text">Physics For Fun</span></span>
    <div class="navbar-right">
      <a href="about.html" class="nav-link">About</a>
      <a href="index.html" class="btn btn-secondary" style="padding:8px 14px;font-size:0.82rem;">Take Again</a>
    </div>
  </nav>

  <div id="loadingState" style="text-align:center;padding:80px 20px;color:var(--text-muted);">
    Loading your results…
  </div>

  <div id="resultContent" style="display:none;">

    <section class="result-hero fade-up">
      <div id="resultBadgeWrap"></div>
      <div class="score-ring-wrap">
        <div class="score-ring" id="scoreRing">
          <div class="score-ring-inner">
            <div class="score-number" id="scoreNumber">—</div>
            <div class="score-total">of 25</div>
          </div>
        </div>
      </div>
      <h1 id="resultHeading" style="margin-bottom:8px;"></h1>
      <p id="resultSubtitle" style="max-width:440px;margin:0 auto 24px;"></p>
      <div class="info-pills" style="justify-content:center;" id="resultPills"></div>
    </section>

    <div class="container">

      <!-- Summary card -->
      <div class="card fade-up fade-up-1" style="margin-bottom:20px;">
        <div style="display:flex;flex-wrap:wrap;gap:20px;">
          <div>
            <div
              style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
              Name</div>
            <div style="font-weight:600;" id="summaryName">—</div>
          </div>
          <div>
            <div
              style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
              Unique ID</div>
            <div style="font-weight:600;" id="summaryUniqueid">—</div>
          </div>
          <div>
            <div
              style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
              Mobile</div>
            <div style="font-weight:600;" id="summaryMobile">—</div>
          </div>
          <div>
            <div
              style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
              School</div>
            <div style="font-weight:600;" id="summarySchool">—</div>
          </div>
          <div>
            <div
              style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
              Email</div>
            <div style="font-weight:600;word-break:break-all;" id="summaryEmail">—</div>
          </div>
          <div>
            <div
              style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
              Submitted</div>
            <div style="font-weight:600;" id="summaryDate">—</div>
          </div>
          <div>
            <div
              style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
              Time Taken</div>
            <div style="font-weight:600;" id="summaryTime">—</div>
          </div>
        </div>
      </div>

      <!-- District -->
      <div id="summaryDistrictWrap" style="display:none;">
        <div
          style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:4px;">
          District</div>
        <div style="font-weight:600;" id="summaryDistrict">—</div>
      </div>

      <!-- Comparison section removed — not applicable for standalone pre-test -->

      <div class="text-center mt-32">
        <a href="index.html" class="btn btn-primary">Take the Test Again →</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div>Quiz by <strong>Dinesh Nagar</strong> &bull; UMS Physics Teacher, CM RISE Sabakheda, Mandsaur</div>
    <div style="margin-top:4px;">
      📞 <a href="tel:9993355323">9993355323</a> &nbsp;|&nbsp;
      ✉️ <a href="mailto:Dineshnagar76@gmail.com">Dineshnagar76@gmail.com</a>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=2.0"></script>
  <script src="js/app.js?v=2.0"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const resultId = urlParams.get('id');

    if (resultId) {
      // Try batch2 collection first, then post-test, then pre-test
      window.db.collection(CONFIG.firestoreCollectionPreBatch2).doc(resultId).get()
        .then(doc => {
          if (doc.exists) {
            renderResult(doc.data());
            return null;
          } else {
            return window.db.collection(CONFIG.firestoreCollectionPost).doc(resultId).get();
          }
        })
        .then(doc => {
          if (doc === null) return null;
          if (doc && doc.exists) {
            renderResult(doc.data());
            return null;
          } else {
            return window.db.collection(CONFIG.firestoreCollection).doc(resultId).get();
          }
        })
        .then(doc => {
          if (doc === null) return;
          if (doc && doc.exists) {
            renderResult(doc.data());
          } else {
            showNotFound();
          }
        })
        .catch(err => {
          console.error("Firestore read error:", err);
          showNotFound();
        });
    } else {
      const submission = getCachedSubmission();
      if (submission) {
        window.history.replaceState(null, '', `?id=${submission.id}`);
        renderResult(submission);
      } else {
        showNotFound();
      }
    }

    function showNotFound() {
      document.getElementById('loadingState').innerHTML = `
        <div style="max-width:360px;margin:0 auto;">
          <div style="font-size:3rem;margin-bottom:12px;">🔍</div>
          <h2>No Result Found</h2>
          <p style="margin:8px 0 24px;">We couldn't find this result or your session expired.</p>
          <a href="index.html" class="btn btn-primary">Start the Test →</a>
        </div>
      `;
    }

    function renderResult(submission) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('resultContent').style.display = 'block';

      const pct = Math.round((submission.score / submission.total) * 100);

      // Score ring
      const ring = document.getElementById('scoreRing');
      ring.style.setProperty('--pct', pct);
      ring.classList.add(submission.passed ? 'pass' : 'fail', submission.passed ? 'pulse-green' : 'pulse-red');
      document.getElementById('scoreNumber').textContent = submission.score;

      // Badge
      document.getElementById('resultBadgeWrap').innerHTML = `
        <div class="result-badge ${submission.passed ? 'pass' : 'fail'}" style="margin-bottom:20px;">
          ${submission.passed ? '🏆 PASSED' : '❌ NOT PASSED'}
        </div>`;

      // Heading
      const firstName = submission.name.split(' ')[0];
      document.getElementById('resultHeading').textContent =
        submission.passed ? `Well done, ${firstName}!` : `Keep Practising, ${firstName}!`;
      document.getElementById('resultSubtitle').textContent =
        submission.passed
          ? `You scored ${submission.score}/25 (${pct}%) — above the pass mark.`
          : `You scored ${submission.score}/25 (${pct}%). Pass mark is 10/25.`;

      // Pills
      document.getElementById('resultPills').innerHTML = `
        <div class="pill">✅ <span style="color:var(--green)">${submission.score} Correct</span></div>
        <div class="pill">❌ <span style="color:var(--red)">${submission.total - submission.score} Wrong</span></div>
        <div class="pill">📊 <span>${pct}%</span></div>`;

      // Summary
      document.getElementById('summaryName').textContent     = submission.name;
      document.getElementById('summaryUniqueid').textContent = submission.uniqueid || '—';
      document.getElementById('summaryMobile').textContent   = submission.mobile   || '—';
      document.getElementById('summarySchool').textContent   = submission.school   || '—';
      document.getElementById('summaryEmail').textContent    = submission.email;
      document.getElementById('summaryDate').textContent     = formatDate(submission.submittedAt);
      const mins = Math.floor(submission.timeTaken / 60);
      const secs = submission.timeTaken % 60;
      document.getElementById('summaryTime').textContent = `${mins}m ${secs}s`;

      // District
      if (submission.district) {
        document.getElementById('summaryDistrictWrap').style.display = '';
        document.getElementById('summaryDistrict').textContent = submission.district;
      }
    }

  </script>
</body>

</html>

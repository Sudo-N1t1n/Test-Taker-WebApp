<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Physics For Fun</title>
  <meta name="description" content="Physics Practical Skills Pre-Test — 25 MCQ questions." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚗️</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #savingOverlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(15,23,42,0.95);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: var(--text); text-align: center; padding: 20px;
    }
    #savingOverlay.show { display: flex; }
  </style>
</head>
<body>

  <!-- Saving overlay -->
  <div id="savingOverlay">
    <div class="spinner"></div>
    <div style="font-size:1.05rem;font-weight:600;">Saving your answers…</div>
    <div style="font-size:0.83rem;color:var(--text-muted);">Please wait — do not close this tab.</div>
  </div>

  <!-- Sticky navbar with timer -->
  <nav class="navbar">
    <span class="navbar-brand">⚗️ <span class="brand-text">Physics For Fun</span></span>
    <div class="navbar-right">
      <div class="timer-box" id="timerBox">
        <span>⏱️</span>
        <span id="timerDisplay">45:00</span>
      </div>
    </div>
    <!-- Global Progress bar attached to navbar -->
    <div class="quiz-progress-bar" style="position: absolute; bottom: 0; left: 0; width: 100%; margin: 0; height: 4px; border-radius: 0; background: var(--bg3);">
      <div class="quiz-progress-fill" id="progressFill" style="width:0%; border-radius: 0;"></div>
    </div>
  </nav>

  <div class="container container--wide" style="padding-top:24px;">

    <!-- Quiz header -->
    <div class="quiz-header fade-up">
      <div>
        <h2>Section 1 — Multiple Choice</h2>
        <p style="margin-top:4px;font-size:0.85rem;" id="progressText">Answered: 0 / 25</p>
      </div>
    </div>

    <!-- Questions -->
    <div id="questionsContainer"></div>
    <div style="height:110px;"></div>
  </div>

  <!-- Sticky submit bar -->
  <div class="submit-bar">
    <div class="submit-bar-info" id="submitInfo">
      Please answer <strong id="remaining">25</strong> more question(s) to submit.
    </div>
    <button class="btn btn-primary" id="submitBtn" disabled onclick="submitQuiz()">
      Submit Test ✓
    </button>
  </div>

  <!-- Confirm modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box" style="max-width:400px;text-align:center;">
      <div style="font-size:2.8rem;margin-bottom:12px;">📤</div>
      <h2 style="margin-bottom:8px;">Submit Your Test?</h2>
      <p style="margin-bottom:24px;">You've answered all 25 questions. Once submitted, you cannot change your answers.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-secondary" id="goBackBtn" onclick="closeConfirm()">Go Back</button>
        <button class="btn btn-primary" id="confirmSubmitBtn" onclick="confirmSubmit()">Yes, Submit</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!sessionStorage.getItem('quiz_pending_name')) {
      window.location.href = 'index.html';
    }

    const user = getPendingUser();
    const answers = new Array(QUESTIONS.length).fill(null);
    let timerSeconds = CONFIG.timerMinutes * 60;
    let timerInterval;
    const startTime = Date.now();

    // ── Render questions ──
    const container = document.getElementById('questionsContainer');

    QUESTIONS.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'question-card scroll-reveal';
      card.id = `q-card-${idx}`;

      const optionsHTML = Object.entries(q.options).map(([key, text]) => `
        <li>
          <label class="option-label" id="opt-${idx}-${key}">
            <input type="radio" name="q${idx}" value="${key}" onchange="selectOption(${idx}, '${key}')" />
            <span class="option-key">${key}</span>
            <span>${text}</span>
          </label>
        </li>
      `).join('');

      card.innerHTML = `
        <div class="question-number">Question ${q.id} of ${QUESTIONS.length}</div>
        <div class="question-text">${q.text}</div>
        <ul class="options-list">${optionsHTML}</ul>
      `;
      container.appendChild(card);
    });

    function selectOption(idx, key) {
      answers[idx] = key;
      Object.keys(QUESTIONS[idx].options).forEach(k => {
        document.getElementById(`opt-${idx}-${k}`).classList.toggle('selected', k === key);
      });
      document.getElementById(`q-card-${idx}`).classList.add('answered');
      updateProgress();
    }

    function updateProgress() {
      const answered  = answers.filter(a => a !== null).length;
      const total     = QUESTIONS.length;
      const remaining = total - answered;
      document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
      document.getElementById('progressText').textContent  = `Answered: ${answered} / ${total}`;
      const ready = remaining === 0;
      document.getElementById('submitBtn').disabled  = !ready;
      const info = document.getElementById('submitInfo');
      if (ready) {
        info.innerHTML = '✅ All questions answered — ready to submit!';
        info.style.color = 'var(--green)';
      } else {
        info.innerHTML = `Please answer <strong>${remaining}</strong> more question(s) to submit.`;
        info.style.color = '';
      }
    }

    function formatTime(s) {
      return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    }

    function startTimer() {
      const display = document.getElementById('timerDisplay');
      const box     = document.getElementById('timerBox');
      timerInterval = setInterval(() => {
        timerSeconds--;
        display.textContent = formatTime(timerSeconds);
        if (timerSeconds <= 300) box.classList.add('warning');
        if (timerSeconds <= 0)   { clearInterval(timerInterval); autoSubmit(); }
      }, 1000);
    }

    function autoSubmit() {
      alert('⏱️ Time is up! Your test will be submitted now.');
      confirmSubmit();
    }

    function submitQuiz() {
      document.getElementById('confirmModal').classList.add('open');
    }

    function closeConfirm() {
      document.getElementById('confirmModal').classList.remove('open');
    }

    async function confirmSubmit() {
      document.getElementById('confirmSubmitBtn').disabled = true;
      document.getElementById('goBackBtn').disabled = true;
      document.getElementById('confirmModal').classList.remove('open');
      clearInterval(timerInterval);
      document.getElementById('savingOverlay').classList.add('show');

      const timeTaken = Math.floor((Date.now() - startTime) / 1000);
      const graded    = gradeAnswers(answers);

      const submission = {
        id:          generateId(),
        name:        user.name,
        email:       user.email,
        submittedAt: new Date().toISOString(),
        timeTaken,
        answers:     answers.slice(),
        score:       graded.score,
        total:       graded.total,
        passed:      graded.passed,
        details:     graded.details,
      };

      try {
        await saveSubmission(submission);
      } catch (err) {
        console.error('Firestore save failed:', err);
      }

      cacheSubmissionLocally(submission);
      window.location.href = 'result.html';
    }

    startTimer();
    updateProgress();
  </script>
</body>
</html>
